name: Python API CI

on: push: branches: [main, master, develop] pullrequest: branches: [main, master, develop] workflowdispatch:

permissions: contents: read

jobs: stage: name: Stage runs-on: ubuntu-latest steps: - name: Checkout source code uses: actions/checkout@v4

- name: Set up Python uses: actions/setup-python@v5 with: python-version: "3.12" cache: pip cache-dependency-path: requirements.txt

- name: Install dependencies run: | python -m pip install --upgrade pip pip install -r requirements.txt

- name: Verify project files run: | test -f app.py test -f main_test.py test -f requirements.txt

build: name: Build runs-on: ubuntu-latest needs: stage steps: - name: Checkout source code uses: actions/checkout@v4

- name: Set up Python uses: actions/setup-python@v5 with: python-version: "3.12" cache: pip cache-dependency-path: requirements.txt

- name: Install dependencies run: pip install -r requirements.txt

- name: Compile Python files run: python -m compileall -q app.py main_test.py

run: name: Run API runs-on: ubuntu-latest needs: build steps: - name: Checkout source code uses: actions/checkout@v4

- name: Set up Python uses: actions/setup-python@v5 with: python-version: "3.12" cache: pip cache-dependency-path: requirements.txt

- name: Install dependencies run: pip install -r requirements.txt

- name: Start API server run: | uvicorn app:app --host 127.0.0.1 --port 8000
> server.log 2>&1 & echo $! > server.pid

- name: Wait for API to start run: | for i in $(seq 1 30); do if curl --fail --silent http://127.0.0.1:8000/health; then echo "API is ready" exit 0 fi sleep 1 done cat server.log exit 1

- name: Smoke-test all five endpoints run: | set -e

# 1. GET / curl --fail --silent http://127.0.0.1:8000/
| python -c "import json,sys; assert json.load(sys.stdin)['message'] == 'Welcome to the Python API'"

# 2. GET /health curl --fail --silent http://127.0.0.1:8000/health
| python -c "import json,sys; assert json.load(sys.stdin)['status'] == 'ok'"

# 3. GET /items curl --fail --silent http://127.0.0.1:8000/items
| python -c "import json,sys; assert len(json.load(sys.stdin)) >= 2"

# 4. GET /items/1 curl --fail --silent http://127.0.0.1:8000/items/1
| python -c "import json,sys; assert json.load(sys.stdin)['id'] == 1"

# 5. POST /items curl --fail --silent
-X POST http://127.0.0.1:8000/items
-H "Content-Type: application/json"
-d '{"name":"CI Test Item","price":10.0}'
| python -c "import json,sys; d=json.load(sys.stdin); assert d['id'] == 3 and d['name'] == 'CI Test Item'"

echo "All five endpoint smoke tests passed."

- name: Show server logs on failure if: failure() run: cat server.log

- name: Stop API server if: always() run: | if [ -f server.pid ]; then kill "$(cat server.pid)" || true fi

test: name: Test runs-on: ubuntu-latest needs: run steps: - name: Checkout source code uses: actions/checkout@v4

- name: Set up Python uses: actions/setup-python@v5 with: python-version: "3.12" cache: pip cache-dependency-path: requirements.txt

- name: Install dependencies run: pip install -r requirements.txt

- name: Run automated tests run: python -m pytest main_test.py -v